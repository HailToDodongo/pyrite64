name: Editor Build (Windows / Linux / macOS)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2.30.0
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure CMake
        run: |
          cmake --preset windows-gcc-release

      - name: Build
        run: |
          cmake --build --preset windows-gcc-release

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: pyrite64-windows
          include-hidden-files: true
          path: |
            pyrite64.exe
            data
            n64
            LICENSE

  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-13 g++-13 \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev
          gcc-13 --version
          g++-13 --version
#            libwayland-dev libwayland-client-dev libwayland-cursor-dev libwayland-egl-dev

      - name: Build AppImage
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          ./scripts/build_appimage.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: pyrite64-linux
          path: |
            Pyrite64-x86_64.AppImage

      - name: Upload test artifact
        uses: actions/upload-artifact@v6
        with:
          name: pyrite64-tests-linux
          path: build/pyrite64_tests
          retention-days: 1

  test-linux:
    needs: build-linux
    runs-on: ubuntu-24.04

    steps:
      - name: Download test artifact
        uses: actions/download-artifact@v6
        with:
          name: pyrite64-tests-linux

      - name: Run unit tests
        run: |
          chmod +x pyrite64_tests
          ./pyrite64_tests

  build-macos:
    # Apple Silicon runner; CMAKE_OSX_ARCHITECTURES builds a universal
    # (arm64 + x86_64) binary so it runs on both Apple Silicon and Intel Macs.
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      # Ensures a CMake >= 3.28 (C++23) and Ninja
      - name: Setup CMake + Ninja
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: |
          cmake --preset macos-release

      - name: Build
        run: |
          cmake --build --preset macos-release

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: pyrite64-macos
          include-hidden-files: true
          path: |
            pyrite64
            data
            n64
            LICENSE
